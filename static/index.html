<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">
  <meta name="color-scheme" content="dark">
<meta name="theme-color" content="#101720">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/pwa-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/pwa-icon.svg">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>LVFR EMS Operations</title>

<link
    rel="stylesheet"
    href="/static/style.css?v=account-settings-4"
>

<style>

    .log-tabs {

        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 16px 0;

    }


    .log-tab {

        padding: 9px 14px;

        border: 1px solid rgba(255,255,255,.12);

        border-radius: 8px;

        cursor: pointer;

    }


    .log-tab.active {

        font-weight: 700;

    }


    /* ========================================================
       LOG TOOLBAR
       ======================================================== */

    .log-toolbar {

        display: flex;

        gap: 10px;

        margin-bottom: 16px;

        align-items: center;

    }


    .log-toolbar input {

        flex: 1;

        min-width: 220px;

    }


    /* ========================================================
       INACTIVE SEARCH
       ======================================================== */

    .inactive-toolbar {

        display: flex;

        gap: 10px;

        margin-bottom: 16px;

        align-items: center;

    }


    .inactive-toolbar input {

        flex: 1;

        min-width: 220px;

    }

</style>

</head>


<body>


<!-- =========================================================
     TOP BAR
     ========================================================= -->

<header class="topbar">


    <div class="brand">


        <img
            class="brand-mark"
            src="/static/image0.webp"
            alt="Lakeside Valley Fire Rescue"
        >


        <div>

            <h1>
                LVFR EMS Operations
            </h1>

            <p>
                Personnel management & promotion control
            </p>

        </div>


    </div>


    <div class="top-actions">

        <button type="button" id="installAppButton" hidden>Install app</button>

        <button type="button" data-action="app-selection">
            App selection
        </button>

        <div class="notification-control">
            <button type="button" id="notificationButton" aria-expanded="false" aria-controls="notificationPanel">
                Notifications <span id="notificationBadge" class="notification-badge" hidden>0</span>
            </button>
            <section id="notificationPanel" class="notification-panel" hidden aria-label="Notifications">
                <div class="notification-panel-head">
                    <strong>Notifications</strong>
                    <button type="button" id="markNotificationsRead">Mark all read</button>
                </div>
                <div id="notificationList"><div class="empty">Loading...</div></div>
            </section>
        </div>

        <span id="accountName" class="status-dot account-user-name"></span>
        <span id="topOnlineCount" class="online-account-count" aria-live="polite">Online now: —</span>
        <button type="button" id="manageAccountButton">Account settings</button>
        <form action="/auth/logout" method="post">
            <button type="submit">Sign out</button>
        </form>


        <span
            id="dbStatus"
            class="status-dot"
        >
            Checking…
        </span>


        <div id="commandSyncPanel" class="command-sync-panel" hidden>
          <div class="sync-status-group">
            <span id="syncStatus" class="status-dot"></span>
            <span id="syncActivityStatus" class="status-dot"></span>
            <span id="googleWriteStatus" class="status-dot archive-status"></span>
            <span id="archiveStatus" class="status-dot archive-status"></span>
          </div>

          <div class="sync-actions">
            <button id="syncBtn" class="primary" type="button">Sync now</button>
          </div>
        </div>


    </div>


</header>


<!-- =========================================================
     MAIN TABS
     ========================================================= -->

<nav class="tabs">


    <button
        data-tab="members"
        class="tab active"
    >
        Members
    </button>


    <button
        data-tab="eligible"
        class="tab"
    >
        Eligible
    </button>

    <button id="doNotPromoteTab" data-tab="doNotPromote" class="tab" style="display:none">
        Do not Promote
    </button>


    <button
        id="inactiveTab"
        data-tab="inactive"
        class="tab"
    >
        Can Be Terminated
    </button>


    <button
        data-tab="membersLog"
        class="tab"
    >
        Members Log
    </button>

    <button id="instructorLogTab" data-tab="instructorLog" class="tab" style="display:none">
        Instructor
    </button>


    <button
        id="leadersTab"
        data-tab="leaders"
        class="tab"
        style="display:none"
    >
        Leaders
    </button>


</nav>


<main>


<!-- =========================================================
     MEMBERS
     ========================================================= -->

<section
    id="members"
    class="panel active"
>


    <div class="section-head">


        <div>

            <h2>
                Members
            </h2>


        </div>


        <span
            id="memberCount"
            class="count"
        >
            0
        </span>


    </div>


    <!-- =====================================================
         REAL-TIME SEARCH
         ===================================================== -->

    <div class="toolbar">


        <input
            id="search"
            type="text"
            placeholder="Search by name, Callsign, or rank"
            autocomplete="off"
        >


        <button
            type="button"
            id="clearBtn"
        >
            Clear
        </button>

        <details class="member-filter-menu">
            <summary>Filters</summary>
            <div class="member-filters">
                <select id="filterRank" aria-label="Filter by rank" title="Rank">
                    <option value="all">Rank: Any</option>
                </select>
                <select id="filterHert" aria-label="Filter by HERT" title="HERT">
                    <option value="all">HERT: Any</option>
                    <option value="yes">HERT: Yes</option>
                    <option value="no">HERT: No</option>
                </select>
                <select id="filterFortInstructor" aria-label="Filter by FORT instructor" title="FORT Instructor">
                    <option value="all">FORT Instructor: Any</option>
                    <option value="yes">FORT Instructor: Yes</option>
                    <option value="no">FORT Instructor: No</option>
                </select>
                <select id="filterHertInstructor" aria-label="Filter by HERT instructor" title="HERT Instructor">
                    <option value="all">HERT Instructor: Any</option>
                    <option value="yes">HERT Instructor: Yes</option>
                    <option value="no">HERT Instructor: No</option>
                </select>
                <select id="filterBasic" aria-label="Filter by Basic FORT" title="Basic FORT">
                    <option value="all">Basic FORT: Any</option>
                    <option value="yes">Basic FORT: Yes</option>
                    <option value="no">Basic FORT: No</option>
                </select>
                <select id="filterAdvanced" aria-label="Filter by Advanced FORT" title="Advanced FORT">
                    <option value="all">Advanced FORT: Any</option>
                    <option value="yes">Advanced FORT: Yes</option>
                    <option value="no">Advanced FORT: No</option>
                </select>
                <select id="filterSupervisorExam" aria-label="Filter by Supervisor Exam" title="Supervisor Exam">
                    <option value="all">Exam: Any</option>
                    <option value="yes">Exam: Passed</option>
                    <option value="no">Exam: No</option>
                </select>
                <select id="filterActivity" aria-label="Filter by Activity" title="Activity">
                    <option value="all">Activity: Any</option>
                    <option value="Active">Active</option>
                    <option value="Semi Active">Semi Active</option>
                    <option value="Inactive">Inactive</option>
                    <option value="Can Be Terminated">Can Be Terminated</option>
                </select>
                <button type="button" id="resetMemberFilters">Reset</button>
            </div>
        </details>


    </div>

    <div
        id="membersTable"
        class="table-wrap"
    ></div>


</section>


<!-- =========================================================
     ELIGIBLE
     ========================================================= -->

<section
    id="eligible"
    class="panel"
>


    <div class="section-head">


        <div>

            <h2>
                Eligible for Promotion
            </h2>


        </div>


    </div>

    <div class="eligible-filter-toolbar">
        <select id="eligibleRankFilter" aria-label="Filter eligible members by rank">
            <option value="all">All eligible ranks</option>
            <option value="volunteer">Volunteer</option>
            <option value="emt">EMT</option>
            <option value="aemt">AEMT</option>
        </select>
    </div>


    <div
        id="eligibleTable"
        class="table-wrap"
    ></div>


</section>


<!-- =========================================================
     Do not Promote
     ========================================================= -->

<section id="doNotPromote" class="panel">
    <div class="section-head"><div><h2>Do not Promote</h2></div></div>
    <div class="table-wrap" id="doNotPromoteTable"></div>
</section>


<!-- =========================================================
     INACTIVE / CAN BE TERMINATED
     ========================================================= -->

<section
    id="inactive"
    class="panel"
>


    <div class="section-head">


        <div>

            <h2>
                Can Be Terminated
            </h2>


        </div>


    </div>


    <!-- =====================================================
         REAL-TIME SEARCH
         ===================================================== -->

    <div class="inactive-toolbar">


        <input
            id="inactiveSearch"
            type="text"
            placeholder="Search by name or Callsign"
            autocomplete="off"
        >


        <button
            type="button"
            id="inactiveClearBtn"
        >
            Clear
        </button>


    </div>


    <div
        id="inactiveTable"
        class="table-wrap"
    ></div>


</section>


<!-- =========================================================
     MEMBERS LOG
     ========================================================= -->

<section
    id="membersLog"
    class="panel"
>


    <div class="section-head">


        <div>

            <h2>
                Members Log
            </h2>


        </div>


    </div>


    <!-- =====================================================
         LOG TABS
         ===================================================== -->

    <div class="log-tabs">


        <button
            type="button"
            class="log-tab active"
            data-log="promotion"
        >
            Promotion/Demotion
        </button>


        <button
            type="button"
            class="log-tab"
            data-log="callsign"
        >
            Callsign Changes
        </button>


        <button
            type="button"
            class="log-tab"
            data-log="termination"
            id="terminationLogTab"
        >
            Termination
        </button>


        <button
            type="button"
            class="log-tab"
            data-log="training"
        >
            Training
        </button>


        <button
            type="button"
            class="log-tab"
            data-log="exam"
        >
            Exam
        </button>


        <button
            type="button"
            class="log-tab"
            data-log="note"
        >
            Note
        </button>

        <button
            type="button"
            class="log-tab"
            data-log="activity"
        >
            Activity
        </button>

        <button type="button" class="log-tab" id="instructorsDirectoryTab" data-log="instructors" style="display:none">
            Instructors
        </button>

    </div>


    <div id="membersLogContent">
    <!-- =====================================================
         LOG SEARCH
         ===================================================== -->

    <div class="log-toolbar">


        <input
            id="membersLogSearch"
            type="text"
            placeholder="Search current log"
            autocomplete="off"
        >


        <button
            type="button"
            id="membersLogClearBtn"
        >
            Clear
        </button>


    </div>

    <div id="logFilters" class="log-filters">
        <label id="promotionFilterWrap">
            Promotion/Demotion
            <select id="promotionFilter" aria-label="Filter promotions and demotions">
                <option value="all">All</option>
                <option value="promotion">Promotion</option>
                <option value="demotion">Demotion</option>
            </select>
        </label>
        <label id="trainingFilterWrap" style="display:none">
            Training
            <select id="trainingFilter" aria-label="Filter training log">
                <option value="all">All</option>
                <option value="basic_firefighting">Basic</option>
                <option value="advanced_firefighting">Advanced</option>
                <option value="hert">HERT</option>
            </select>
        </label>
        <label id="noteFilterWrap" style="display:none">
            Action
            <select id="noteFilter" aria-label="Filter note actions">
                <option value="all">All</option>
                <option value="add">Add</option>
                <option value="delete">Delete</option>
                <option value="edit">Edit</option>
            </select>
        </label>
    </div>


    <div
        id="membersLogTable"
        class="table-wrap"
    ></div>

    </div>

    <div id="instructorsView" style="display:none">
        <div class="toolbar">
            <input id="instructorSearch" type="text" placeholder="Search instructor name" autocomplete="off">
            <button type="button" id="clearInstructorSearch">Clear</button>
        </div>
        <div class="log-filters">
            <label for="instructorTypeFilter">Type
                <select id="instructorTypeFilter" aria-label="Filter instructors by type">
                    <option value="all">All types</option>
                    <option value="HERT">HERT</option>
                    <option value="FORT">FORT</option>
                </select>
            </label>
        </div>
        <div id="instructorsTable" class="table-wrap"></div>
    </div>


</section>


<!-- =========================================================
     INSTRUCTOR LOG
     ========================================================= -->

<section id="instructorLog" class="panel">
    <div class="section-head"><div><h2>Instructor Log</h2></div></div>
    <div class="log-toolbar">
        <input id="instructorLogSearch" type="text" placeholder="Search instructor log" autocomplete="off">
        <button type="button" id="instructorLogClearBtn">Clear</button>
    </div>
    <div id="instructorLogTable" class="table-wrap"></div>
</section>


<!-- =========================================================
     ACCOUNT MANAGEMENT
     ========================================================= -->

<section
    id="leaders"
    class="panel"
>
    <div class="section-head">
        <div>
            <h2>Leaders</h2>
        </div>
    </div>

    <div class="log-tabs">
        <button type="button" class="log-tab leader-view-tab" data-leader-view="pending">
            Requests <span id="pendingLeaderCount">0</span>
        </button>
        <button type="button" class="log-tab leader-view-tab active" data-leader-view="all">All Members</button>
        <button type="button" class="log-tab leader-view-tab" data-leader-view="audit">History</button>
    </div>

    <div id="pendingLeadersView" style="display:none">
        <div id="pendingLeadersTable" class="table-wrap"></div>
    </div>

    <div id="allLeadersView">
        <p id="onlineAccountCount" class="online-account-count" aria-live="polite">Online now: —</p>
        <div class="log-filters leader-role-filter">
            <label for="leaderRoleFilter">Role</label>
            <select id="leaderRoleFilter" aria-label="Filter Leaders by role">
                <option value="all">All roles</option>
                <option value="leader">Leader</option>
                <option value="member">Member</option>
                <option value="admin">Commander</option>
            </select>
        </div>
        <div id="allLeadersTable" class="table-wrap"></div>
    </div>

    <div id="leaderAuditView" style="display:none">
        <div id="leaderAuditTable" class="table-wrap"></div>
    </div>
</section>


</main>

<!-- =========================================================
     MODAL
     ========================================================= -->

<div
    id="modal"
    class="modal hidden"
    role="dialog"
    aria-modal="true"
    aria-label="Member details"
>


    <div class="modal-box">


        <button
            class="close"
            data-action="close-modal"
        >&times;</button>


        <div id="modalContent"></div>


    </div>


</div>


<!-- =========================================================
     TOAST
     ========================================================= -->

<div id="toast" aria-live="polite"></div>


<!-- =========================================================
     APPLICATION JAVASCRIPT
     ========================================================= -->

<script src="/static/session-auth.js?v=shared-session-4"></script>
<script src="/static/account-settings.js?v=account-settings-5"></script>
<script src="/static/app.js?v=manual-sync-34-instructors-log-subtab"></script>
<script src="/static/pwa.js"></script>


</body>

</html>
